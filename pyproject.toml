[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "azure_document_processing_pipeline"
version = "0.1.0"
authors = [
  { name="Jules", email="jules@example.com" },
]
description = "An Azure Functions pipeline for processing documents with AI services."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}  # Replaces deprecated classifier
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "azure-functions",
    "azure-storage-blob",
    "azure-storage-queue",
    "azure-ai-documentintelligence",
    "azure-data-tables",
    "openai",
    "pydantic",
    "thefuzz",
    "python-Levenshtein",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
]

[tool.ruff]
line-length = 120
select = ["ALL"]
ignore = [
   "PGH003",
   "G004",
   "ANN401"
]

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.setuptools.packages.find]
include = ["function_app", "models"]
