name: CI (uv.lock aware)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [3.12]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install uv
        run: python -m pip install "uv>=0.0.0"

      - name: Create / ensure virtualenv (uv)
        run: |
          # Create a .venv (uv will create .venv by default)
          uv venv

      - name: Sync dependencies (use uv.lock if present)
        run: |
          # If uv.lock exists, use --locked to ensure CI installs exactly the locked deps.
          # If uv.lock is missing, uv sync will generate and install (useful for first run).
          if [ -f uv.lock ]; then
            echo "uv.lock found — running 'uv sync --locked' to install exact locked deps"
            uv sync --locked
          else
            echo "uv.lock not found — running 'uv sync' (this will create uv.lock)"
            uv sync
          fi

      - name: Run pre-commit checks (all files)
        env:
          # ensure the venv is used; uvx will run tools reproducibly too
          PATH: .venv/bin:$PATH
        run: |
          # Run pre-commit via uvx (ephemeral tool runner) OR the installed binary in .venv
          if command -v uvx >/dev/null 2>&1; then
            uvx pre-commit run --all-files
          else
            .venv/bin/pre-commit run --all-files
          fi

      - name: Ruff format check
        env:
          PATH: .venv/bin:$PATH
        run: |
          .venv/bin/ruff format --diff --check

      - name: Ruff lint (fail on errors)
        env:
          PATH: .venv/bin:$PATH
        run: |
          .venv/bin/ruff check .

      - name: Type check (basedpyright / pyright)
        env:
          PATH: .venv/bin:$PATH
        run: |
          # basedpyright or pyright should be installed in dev deps
          .venv/bin/basedpyright --level error

      - name: Run tests with coverage
        env:
          PATH: .venv/bin:$PATH
        run: |
          .venv/bin/pytest --maxfail=1 --disable-warnings --cov=.

      - name: Upload coverage artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
